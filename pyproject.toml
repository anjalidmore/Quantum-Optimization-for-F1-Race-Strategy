[project]
name = "f1-quantum-strategy"
version = "0.1.0"
description = "Quantum Optimization for Formula 1 Race Strategy — unified computational-intelligence platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# A SettingWithCopyWarning means an assignment may or may not have propagated —
# pandas cannot tell you which. That is a correctness question, not style, and
# it becomes an error in pandas 3.x under copy-on-write. Failing the build on
# it stops the 69 occurrences this project used to emit from creeping back.
filterwarnings = [
    "error::pandas.errors.SettingWithCopyWarning",
]
markers = [
    "slow: deliberately reproduces a crash in a subprocess; a few seconds each",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines are common in this codebase's explanatory docstrings/comments

[tool.ruff.lint.per-file-ignores]
# scripts/ and tests/ intentionally insert the repo root onto sys.path before
# importing app.* modules, so imports can't all live at the top of the file.
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
